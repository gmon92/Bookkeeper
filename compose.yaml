name: local-bookkeeper

services:
  bookkeeper:
    build: .
    image: local-bookkeeper:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BOOKKEEPER_PORT:-8766}:8765"
    environment:
      LOCAL_BOOKKEEPER_ALLOWED_HOSTS: "127.0.0.1:${BOOKKEEPER_PORT:-8766},localhost:${BOOKKEEPER_PORT:-8766}"
    volumes:
      - type: bind
        source: ${BOOKKEEPER_DATA_DIR:-./bookkeeper-data}
        target: /data
        bind:
          create_host_path: true
    stop_grace_period: 20s
